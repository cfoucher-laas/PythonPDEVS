[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PythonPDEVS"
version = "2.4.2"
requires-python = ">=3.7"

[project.optional-dependencies]
mpi = ["mpi4py>=3.1.2"]

[project.urls]
Documentation = "https://msdl.uantwerpen.be/documentation/PythonPDEVS"
Repository = "https://github.com/cfoucher-laas/PythonPDEVS"
"Original Repository" = "https://github.com/msdl/PythonPDEVS"

[tool.setuptools]
package-dir = {"" = "src"}
